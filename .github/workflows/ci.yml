name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cicd-demo:${{ github.sha }} .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name app -e APP_VERSION=${{ github.sha }} cicd-demo:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs localhost:8000/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

  push:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: cicd-demo
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::392712991786:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "Pushed $IMAGE"

  deploy:
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-0292a014cc28855ba
      IMAGE: 392712991786.dkr.ecr.ap-south-1.amazonaws.com/cicd-demo:${{ github.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::392712991786:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy over SSM
        run: |
          {
            echo "export HOME=/root"
            echo "IMAGE=$IMAGE"
            echo "SHA=${{ github.sha }}"
            cat << 'SCRIPT'
          set -e
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${IMAGE%%/*}
          docker pull "$IMAGE"
          docker rm -f cicd-demo 2>/dev/null || true
          docker run -d --name cicd-demo --restart unless-stopped -p 8000:8000 -e APP_VERSION="$SHA" "$IMAGE"
          for i in $(seq 1 15); do
            if curl -fs localhost:8000/health; then echo; echo "Healthy: $SHA"; exit 0; fi
            sleep 2
          done
          docker logs cicd-demo
          exit 1
          SCRIPT
          } > deploy.sh
          PARAMS=$(jq -n --rawfile s deploy.sh '{commands: ($s | split("\n"))}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "SSM status: $STATUS"
          [ "$STATUS" = "Success" ]
