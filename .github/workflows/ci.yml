name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cicd-demo:${{ github.sha }} .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name app -e APP_VERSION=${{ github.sha }} cicd-demo:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs localhost:8000/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

  push:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: cicd-demo
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::392712991786:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "Pushed $IMAGE"

  deploy-staging:
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-0292a014cc28855ba
      SHA: ${{ github.sha }}
      IMAGE: 392712991786.dkr.ecr.ap-south-1.amazonaws.com/cicd-demo:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::392712991786:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to staging (port 8001)
        run: bash scripts/ssm-run.sh staging

  deploy-production:
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-0292a014cc28855ba
      SHA: ${{ github.sha }}
      IMAGE: 392712991786.dkr.ecr.ap-south-1.amazonaws.com/cicd-demo:${{ github.sha }}
      SIMULATE_FAILURE: ${{ contains(github.event.head_commit.message, '[simulate-failure]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::392712991786:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to production (port 8000) with rollback
        run: bash scripts/ssm-run.sh production
